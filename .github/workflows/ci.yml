name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: invoice
          POSTGRES_PASSWORD: invoice
          POSTGRES_DB: invoice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoice -d invoice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://invoice:invoice@localhost:5432/invoice_test
      # The S3 storage suite (test bucket on Garage, path-style).
      TEST_S3_ENDPOINT: ${{ secrets.TEST_S3_ENDPOINT }}
      TEST_S3_BUCKET: ${{ secrets.TEST_S3_BUCKET }}
      TEST_S3_REGION: ${{ secrets.TEST_S3_REGION }}
      TEST_S3_ACCESS_KEY_ID: ${{ secrets.TEST_S3_ACCESS_KEY_ID }}
      TEST_S3_SECRET_ACCESS_KEY: ${{ secrets.TEST_S3_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
      # Must equal rust-toolchain.toml's channel — bump both together.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - name: Toolchain pin matches rust-toolchain.toml
        run: grep -q 'channel = "1.97.0"' rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # xmllint validates ISDOC exports against the vendored XSD.
      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - run: make lint-backend test-backend
      # The committed frontend/src/api/schema.d.ts must match the backend's OpenAPI document.
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make frontend-install api-types-check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make frontend-install lint-frontend test-frontend frontend-build
