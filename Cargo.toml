[package]
name = "invoiceapp"
version = "0.1.2"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "invoiceapp"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
bytes = "1"
calamine = "0.35"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false }
csv = "1"
encoding_rs = "0.8"
getrandom = "0.3"
hmac = "0.12"
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
futures-util = { version = "0.3", default-features = false }
libc = "0.2"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots", "hostname"] }
md-5 = "0.10"
mdcast-client = "0.4.2"
mime_guess = "2"
minijinja = { version = "2", features = ["fuel"] }
object_store = { version = "0.14", features = ["aws", "fs"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "charset", "http2"] }
roxmltree = "0.21"
rust_decimal = { version = "1", features = ["serde"] }
rust-embed = "8"
sea-orm = { version = "1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-rust_decimal", "with-json", "postgres-array"] }
sea-orm-migration = { version = "1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace", "compression-br", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["uuid", "chrono", "decimal"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono-tz = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
schemars = { version = "1", features = ["chrono04", "uuid1"] }

# argon2 is unusably slow unoptimised; tests hash passwords on every login.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[dev-dependencies]
# Signing the mock OIDC provider's ID tokens from the test PEM keys.
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
rust_xlsxwriter = "0.95"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
